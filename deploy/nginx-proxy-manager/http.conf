# Rate limit zone for the two assistants.
#
# limit_req_zone must be declared at the http level, which the per-host
# Advanced box cannot reach. Nginx Proxy Manager includes anything in
# /data/nginx/custom/http.conf, so it goes there:
#
#   docker cp deploy/nginx-proxy-manager/http.conf proxy-app-1:/data/nginx/custom/http.conf
#   docker restart proxy-app-1
#
# Then add this line to each proxy host's Advanced box:
#
#   limit_req zone=cashew_chat burst=10 nodelay;
#
# Both endpoints are public and every request costs Azure tokens, so this is
# the difference between a demo and an open tab on your bill. A Clarity
# answer runs to roughly 4,700 tokens including reasoning.

limit_req_zone $binary_remote_addr zone=cashew_chat:10m rate=20r/m;
