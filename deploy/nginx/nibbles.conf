# Nibbles, the customer-facing assistant. Public by design, no auth.
#
# Note that /lead accepts names, emails and phone numbers. Over plain HTTP
# that personal data crosses the network in clear text, so put TLS on this
# host before you publish the address anywhere.
#
#   sudo ln -s /etc/nginx/sites-available/nibbles.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nibbles.ai.geco.asia -d clarity.ai.geco.asia

server {
    listen 80;
    server_name nibbles.ai.geco.asia;

    # Keep a single shopper from hammering the model endpoint.
    limit_req zone=nibbles_chat burst=10 nodelay;

    location / {
        proxy_pass http://127.0.0.1:5001;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- the part that makes streaming work ---------------------------
        proxy_buffering    off;
        proxy_cache        off;
        # Compressing an event stream forces nginx to buffer it.
        gzip               off;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        chunked_transfer_encoding on;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:5001/healthz;
        access_log off;
    }
}
