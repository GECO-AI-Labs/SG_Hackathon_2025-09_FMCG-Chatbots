# Clarity, the internal analytics assistant.
#
# Clarity can read unit costs, gross margins and campaign returns. It ships
# with no authentication of its own, so whatever guards this server block is
# the only thing standing between the open internet and your P&L. The basic
# auth below is the minimum. An SSO proxy or an IP allowlist is better.
#
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-clarity <username>
#   sudo ln -s /etc/nginx/sites-available/clarity.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name clarity.ai.geco.asia;

    # Once certbot has run this block is replaced by the redirect it writes.
    location / {
        auth_basic           "Cashew4Nuts staff";
        auth_basic_user_file /etc/nginx/.htpasswd-clarity;

        proxy_pass http://127.0.0.1:5000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- the part that makes streaming work ---------------------------
        # With buffering on, nginx holds the whole answer and releases it as
        # one blob, which removes the point of streaming entirely.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # A reasoning model can think for a while before the first token, and
        # a long answer can run for minutes. The default 60s cuts it off.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        chunked_transfer_encoding on;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:5000/healthz;
        access_log off;
    }
}
