# Brings both assistants up against the same dataset.
#   cp .env.example .env   (then fill in AZURE_API_KEY and AZURE_DEPLOYMENT)
#   docker compose up --build
services:
  clarity:
    build:
      context: .
      dockerfile: apps/clarity/Dockerfile
    image: cashew4nuts-clarity
    container_name: clarity
    env_file: .env
    environment:
      DATA_DIR: /app/data/Team_Cashew_Synthetic_Data
    ports:
      # Bound to loopback so the only way in is through nginx. Publishing on
      # 0.0.0.0 would let anyone reach Clarity on <vm-ip>:5000 and skip the
      # basic auth that protects the cost and margin data.
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  nibbles:
    build:
      context: .
      dockerfile: apps/nibbles/Dockerfile
    image: cashew4nuts-nibbles
    container_name: nibbles
    env_file: .env
    environment:
      DATA_DIR: /app/data/Team_Cashew_Synthetic_Data
      LEADS_FILE: /app/data/runtime/nibbles_leads.csv
    ports:
      # Loopback only; nginx terminates the public connection.
      - "127.0.0.1:5001:5001"
    volumes:
      # Captured leads survive a container rebuild. The host directory must
      # be owned by uid 10001, the container's appuser, because a bind mount
      # adopts host ownership and overrides the chown done in the image:
      #   sudo chown -R 10001:10001 data/runtime
      # deploy/bootstrap-vm.sh does this for you.
      - ./data/runtime:/app/data/runtime
    restart: unless-stopped
